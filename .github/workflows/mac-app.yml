name: Mac app

on:
  push:
    tags:
      - "*"

jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Require lightweight tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          kind="$(git cat-file -t "refs/tags/${TAG}")"
          if [ "${kind}" != "commit" ]; then
            echo "Refusing annotated tag ${TAG} (object type: ${kind}). Use a lightweight tag."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${TAG} (${GITHUB_SHA}) is not on origin/main."
            exit 1
          fi
          echo "Lightweight tag ${TAG} is on main."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Package Mac app
        run: npm run package:mac

      - name: Zip app
        run: |
          cd release
          zip -ry "../hailstone-mac-${GITHUB_REF_NAME}.zip" Hailstone

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hailstone-mac-${{ github.ref_name }}
          path: hailstone-mac-${{ github.ref_name }}.zip
          if-no-files-found: error
