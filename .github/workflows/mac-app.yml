name: Mac app

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Lightweight release tag to build (e.g. v0.1.0)
        required: true
        type: string

jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Require lightweight tag on main
        run: |
          set -euo pipefail
          kind="$(git cat-file -t "refs/tags/${TAG}")"
          if [ "${kind}" != "commit" ]; then
            echo "Refusing annotated tag ${TAG} (object type: ${kind}). Use a lightweight tag."
            exit 1
          fi
          git fetch origin main
          tagged="$(git rev-parse "refs/tags/${TAG}^{}")"
          if ! git merge-base --is-ancestor "${tagged}" origin/main; then
            echo "Tag ${TAG} (${tagged}) is not on origin/main."
            exit 1
          fi
          echo "Lightweight tag ${TAG} (${tagged}) is on main."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Package Mac app
        env:
          HAILSTONE_VERSION: ${{ env.TAG }}
        run: npm run package:mac

      - name: Zip app
        run: |
          set -euo pipefail
          mkdir -p release
          if [ ! -d "release/Hailstone-${TAG}" ]; then
            if [ -d release/Hailstone ]; then
              mv release/Hailstone "release/Hailstone-${TAG}"
            else
              echo "Mac app folder not found in release/"
              ls -la release || true
              exit 1
            fi
          fi
          cd release
          zip -ry "../hailstone-${TAG}.zip" "Hailstone-${TAG}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hailstone-${{ env.TAG }}
          path: hailstone-${{ env.TAG }}.zip
          if-no-files-found: error
          overwrite: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "hailstone-${TAG}.zip" --clobber
          else
            gh release create "${TAG}" \
              "hailstone-${TAG}.zip" \
              --title "${TAG}" \
              --notes "Mac app for ${TAG}."
          fi
